name: Release @pluscosmic/ui

# Publishes packages/ui as a tarball on a GitHub release, which apps depend on by URL (README.md, "Releasing"):
# either push a `ui-v<version>` tag on main, or start it from Actions on main with the version, in which case the
# release makes the tag on main's head. Either way the version must match packages/ui/package.json's.
on:
  push:
    tags:
      - "ui-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, as in packages/ui/package.json (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-ui

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Check the tag matches the package's version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="$(node -p 'require("./packages/ui/package.json").version')"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "::error::Start the release from main, not ${GITHUB_REF_NAME}."
              exit 1
            fi
            tag="ui-v${REQUESTED}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [ "${tag}" != "ui-v${version}" ]; then
            echo "::error::${tag} doesn't match packages/ui/package.json's version ${version} (expected ui-v${version})."
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Pack
        run: |
          mkdir -p dist-release
          (cd packages/ui && npm pack --pack-destination ../../dist-release)
          ls -l dist-release

      - name: Check the packed package in a fresh app
        run: scripts/check-package.sh "dist-release/pluscosmic-ui-${VERSION}.tgz"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # --target makes the tag on this commit when it doesn't exist yet (a release started from Actions).
        run: |
          gh release create "${TAG}" "dist-release/pluscosmic-ui-${VERSION}.tgz" \
            --target "${GITHUB_SHA}" \
            --title "@pluscosmic/ui ${VERSION}" \
            --notes "Depend on it with \`\"@pluscosmic/ui\": \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/pluscosmic-ui-${VERSION}.tgz\"\`."
